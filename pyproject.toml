[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mooneural"
version = "0.1.0"
description = "Constrained multi-objective neural solver training with transactional checkpoints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "tensorflow>=2.16"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/chakkeiwong/MOONeural"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: expensive numerical check",
    "medium: intermediate numerical suite",
    "contract: stable library API and transaction behavior",
    "integration: optional numerical integration checks",
    "numerics: compiled numerical checks",
    "neural: neural training fixture",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
